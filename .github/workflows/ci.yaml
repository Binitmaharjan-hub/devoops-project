name: CI Workflow
on:
  push:
    branches:
      - main

jobs:
  login-docker:
    runs-on: self-hosted
    environment: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
  build-and-push-frontend:
    runs-on: self-hosted
    environment: test
    needs: login-docker
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./student-ui
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/student-ui:${{ github.run_number }}
      
  build-and-push-backend:
    runs-on: self-hosted
    environment: test
    needs: login-docker
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./student-backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/student-backend:${{ github.run_number }}